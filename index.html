<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hostr.net</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .brand-container {
            text-align: center;
            padding: 20px;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.25rem;
            font-weight: 400;
            color: #3b82f6;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .main-title {
                font-size: 2.8rem;
                letter-spacing: 1px;
            }
            .subtitle {
                font-size: 1rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <h1 class="main-title">HOSTR</h1>
        <div class="subtitle">Web Solutions</div>
    </div>

</body>
</html>
